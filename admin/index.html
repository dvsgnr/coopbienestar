<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de Publicación — CoopBienestar</title>
<link rel="icon" href="https://coopbienestar.net/wp-content/uploads/2023/05/cropped-Logo-143x143.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --cb-950:#071e12;--cb-900:#0b3521;--cb-800:#114230;--cb-700:#164e3a;--cb-600:#1b5c3e;
  --cb-500:#237a52;--cb-400:#4a9e78;--cb-300:#7dc0a0;--cb-200:#b4dcc8;--cb-100:#e3f1ea;--cb-50:#f2f9f5;
  --gold-700:#8a5e0f;--gold-600:#a87318;--gold-500:#c8901e;--gold-400:#e0a830;--gold-200:#f5d98a;--gold-100:#fdf3dc;
  --n-900:#1a2820;--n-800:#243230;--n-700:#2e4038;--n-600:#3d4f48;--n-500:#4d6159;
  --n-400:#6b7e77;--n-300:#8e9e98;--n-200:#b8c5c0;--n-100:#d8e2de;--n-50:#eff3f1;--n-10:#f5f8f6;
  --primary:var(--cb-600);--accent:var(--gold-500);--border:var(--n-100);
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:9999px;
  --font:'Roboto','Helvetica Neue',system-ui,sans-serif;
  --sh-sm:0 2px 8px rgba(14,53,36,.08),0 1px 2px rgba(14,53,36,.05);
  --sh-md:0 6px 20px rgba(14,53,36,.10),0 2px 6px rgba(14,53,36,.06);
  --sh-lg:0 16px 48px rgba(14,53,36,.13),0 4px 12px rgba(14,53,36,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--n-10);color:var(--n-700);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
img{display:block;max-width:100%}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--font)}
a{text-decoration:none;color:inherit}

/* LOGIN */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--cb-900) 0%,var(--cb-700) 60%,var(--cb-800) 100%);z-index:9999}
#login.hidden{display:none}
.login-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:420px;max-width:90vw;padding:48px 44px;text-align:center}
.login-logo{width:90px;height:90px;border-radius:var(--r-md);margin:0 auto 22px;object-fit:cover;box-shadow:0 0 0 1px var(--n-50)}
.login-card h1{font-size:23px;font-weight:500;color:var(--n-900);margin-bottom:6px}
.login-card .sub{font-size:14.5px;color:var(--n-400);margin-bottom:32px;line-height:1.55}
.gh-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:var(--n-900);color:#fff;
  font-size:15.5px;font-weight:500;padding:14px;border-radius:var(--r-sm);transition:background .15s,transform .1s;cursor:pointer;border:none}
.gh-btn:hover{background:#000;transform:translateY(-1px)}
.gh-btn:disabled{opacity:.5;cursor:default;transform:none}
.login-foot{margin-top:26px;font-size:12.5px;color:var(--n-300);line-height:1.6}

/* APP SHELL */
.app{display:grid;height:100vh;grid-template-columns:248px 1fr;grid-template-rows:60px 1fr;visibility:hidden;opacity:0;transition:opacity .3s}
.app.show{visibility:visible;opacity:1}
.sidebar{grid-row:1/3;background:var(--cb-900);display:flex;flex-direction:column}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand img{width:38px;height:38px;border-radius:var(--r-sm);object-fit:cover}
.side-brand .nm{font-size:14.5px;font-weight:600;color:#fff;line-height:1.2}
.side-brand .sb{font-size:11px;color:rgba(255,255,255,.45);display:block;margin-top:1px}
.side-section{padding:20px 14px 8px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.32)}
.side-nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.side-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-sm);font-size:14.5px;
  color:rgba(255,255,255,.74);transition:all .15s;text-align:left;width:100%}
.side-link:hover{background:rgba(255,255,255,.07);color:#fff}
.side-link.active{background:var(--gold-400);color:var(--cb-950);font-weight:500}
.side-link svg{flex-shrink:0}
.side-link .badge{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;
  padding:1px 8px;border-radius:var(--r-pill);min-width:22px;text-align:center}
.side-link.active .badge{background:rgba(7,30,18,.18);color:var(--cb-950)}
.side-foot{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{display:flex;align-items:center;gap:10px}
.side-user .ava{width:32px;height:32px;border-radius:50%;background:var(--gold-400);color:var(--cb-950);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;overflow:hidden;flex-shrink:0}
.side-user .ava img{width:100%;height:100%;object-fit:cover}
.side-user .un{font-size:13px;color:#fff;font-weight:500;line-height:1.2}
.side-user .ur{font-size:11px;color:rgba(255,255,255,.45)}
.topbar{grid-column:2;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px}
.topbar .crumb{font-size:13px;color:var(--n-400)}
.topbar .crumb b{color:var(--n-800);font-weight:500}
.topbar .spacer{margin-left:auto}
.tb-status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--n-400)}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:var(--cb-400)}
.main{grid-column:2;overflow-y:auto;padding:32px 36px 60px}

/* PAGE HEAD */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:20px;flex-wrap:wrap}
.page-head h2{font-size:26px;font-weight:500;color:var(--n-900);letter-spacing:-.01em}
.page-head p{font-size:14px;color:var(--n-400);margin-top:4px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;font-size:14.5px;font-weight:500;
  border-radius:var(--r-sm);transition:all .15s;white-space:nowrap;cursor:pointer;border:none}
.btn svg{flex-shrink:0}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--gold-600);transform:translateY(-1px);box-shadow:0 4px 14px rgba(200,144,30,.32)}
.btn-green{background:var(--primary);color:#fff}
.btn-green:hover{background:var(--cb-700);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--n-600);border:1.5px solid var(--n-100)}
.btn-ghost:hover{background:var(--n-10);border-color:var(--n-200)}
.btn-danger{background:transparent;color:#c0392b;border:1.5px solid #f5c6c6}
.btn-danger:hover{background:#fff0f0}
.btn-lg{padding:13px 26px;font-size:15px}
.btn-sm{padding:7px 14px;font-size:13px}

/* DASHBOARD */
.dash-hello{margin-bottom:30px}
.dash-hello h2{font-size:28px;font-weight:300;color:var(--n-900);letter-spacing:-.01em}
.dash-hello h2 b{font-weight:500}
.dash-hello p{font-size:15px;color:var(--n-400);margin-top:6px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px}
.dash-card{background:#fff;border:1px solid var(--n-50);border-radius:var(--r-md);padding:30px;box-shadow:var(--sh-sm);
  transition:all .2s;text-align:left;position:relative;overflow:hidden;cursor:pointer}
.dash-card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold-400);
  transform:scaleX(0);transform-origin:left;transition:transform .3s}
.dash-card:hover{box-shadow:var(--sh-md);transform:translateY(-3px);border-color:var(--cb-200)}
.dash-card:hover::after{transform:scaleX(1)}
.dash-ico{width:52px;height:52px;border-radius:var(--r-md);background:var(--cb-100);color:var(--cb-600);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.dash-card h3{font-size:19px;font-weight:500;color:var(--n-900);margin-bottom:6px}
.dash-card p{font-size:14px;color:var(--n-500);line-height:1.55;margin-bottom:16px}
.dash-card .count{font-size:13px;color:var(--n-400);display:flex;align-items:center;gap:6px}
.dash-card .count b{color:var(--cb-600);font-weight:600}
.dash-arrow{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--primary);margin-top:14px}

/* ENTRY LIST */
.entry-list{display:flex;flex-direction:column;gap:1px;background:var(--n-50);border:1px solid var(--n-50);border-radius:var(--r-md);overflow:hidden}
.entry{display:flex;align-items:center;gap:18px;padding:16px 20px;background:#fff;transition:background .12s}
.entry:hover{background:var(--cb-50)}
.entry-thumb{width:64px;height:48px;border-radius:var(--r-xs);object-fit:cover;flex-shrink:0;background:var(--n-50)}
.entry-main{flex:1;min-width:0;cursor:pointer}
.entry-main h4{font-size:15.5px;font-weight:500;color:var(--n-900);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--n-400)}
.entry-tag{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--cb-600);
  background:var(--cb-100);padding:2px 9px;border-radius:var(--r-pill)}
.entry-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.entry-btn{font-size:13px;color:var(--n-300);display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--r-xs);transition:all .12s}
.entry-btn:hover{background:var(--n-50);color:var(--primary)}
.entry-btn.del:hover{color:#c0392b;background:#fff0f0}

/* EDITOR */
.editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--n-50);border-radius:var(--r-md);
  overflow:hidden;box-shadow:var(--sh-sm);background:#fff;min-height:560px}
.editor-form{padding:30px 32px;border-right:1px solid var(--n-50);overflow-y:auto}
.editor-preview{background:var(--n-10);padding:26px;overflow-y:auto}
.ed-section{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--n-300);
  margin-bottom:18px;display:flex;align-items:center;gap:8px}
.fg{margin-bottom:20px}
.fg label{display:block;font-size:13.5px;font-weight:500;color:var(--n-700);margin-bottom:6px}
.fg label .req{color:var(--gold-600)}
.fg .hint{font-size:12px;color:var(--n-300);font-weight:400;margin-top:5px;line-height:1.45}
.fld{width:100%;padding:11px 14px;font-size:14.5px;color:var(--n-900);background:#fff;border:1.5px solid var(--n-100);
  border-radius:var(--r-sm);outline:none;transition:border-color .15s,box-shadow .15s}
.fld:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(27,92,62,.12)}
textarea.fld{resize:vertical;min-height:100px;line-height:1.55}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.drop{border:2px dashed var(--n-200);border-radius:var(--r-sm);padding:26px;text-align:center;background:var(--n-10);
  transition:all .18s;cursor:pointer;position:relative}
.drop:hover{border-color:var(--cb-400);background:var(--cb-50)}
.drop.has{padding:0;border-style:solid;border-color:var(--n-100);overflow:hidden}
.drop .di{width:42px;height:42px;border-radius:50%;background:var(--cb-100);color:var(--cb-600);display:flex;
  align-items:center;justify-content:center;margin:0 auto 12px}
.drop .dt{font-size:14px;color:var(--n-600);font-weight:500}
.drop .ds{font-size:12.5px;color:var(--n-300);margin-top:3px}
.drop img{width:100%;height:170px;object-fit:cover;display:block}
.drop-replace{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#fff;
  font-size:12.5px;color:var(--n-400)}
.drop-replace b{color:var(--n-700);font-weight:500}
.drop-replace .lnk{color:var(--primary);font-weight:500}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop.has input[type=file]{height:auto;bottom:0;top:auto;padding:0}
.pv-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cb-600);
  margin-bottom:14px;display:flex;align-items:center;gap:7px}
.pv-card{background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden;max-width:380px}
.pv-card-img{width:100%;height:190px;object-fit:cover;background:var(--n-50);display:flex;align-items:center;justify-content:center;color:var(--n-200)}
.pv-card-body{padding:22px}
.pv-tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--primary);background:var(--cb-100);padding:4px 10px;border-radius:var(--r-pill);margin-bottom:10px}
.pv-date{font-size:13px;color:var(--n-400);margin-bottom:8px;display:block}
.pv-card-body h3{font-size:19px;font-weight:500;color:var(--n-900);margin-bottom:10px;line-height:1.35}
.pv-card-body p{font-size:14.5px;line-height:1.6;color:var(--n-500)}
.pv-note{font-size:12px;color:var(--n-300);margin-top:16px;text-align:center;line-height:1.5}
.editor-foot{display:flex;align-items:center;gap:12px;margin-top:26px;padding-top:22px;border-top:1px solid var(--n-50)}
.editor-foot .spacer{margin-left:auto}

/* GALLERY */
.gal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gal-add{border:2px dashed var(--n-200);border-radius:var(--r-md);aspect-ratio:4/3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:var(--n-400);transition:all .18s;background:var(--n-10);cursor:pointer;position:relative}
.gal-add:hover{border-color:var(--cb-400);background:var(--cb-50);color:var(--cb-600)}
.gal-add .gi{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:center;color:var(--cb-600)}
.gal-add span{font-size:13px;font-weight:500}
.gal-add input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.gal-item{border-radius:var(--r-md);overflow:hidden;position:relative;aspect-ratio:4/3;box-shadow:var(--sh-sm);background:var(--n-50)}
.gal-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gal-item:hover img{transform:scale(1.05)}
.gal-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,53,33,.82),transparent 55%);
  opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.gal-item:hover .gal-ov{opacity:1}
.gal-ov .cap{color:#fff;font-size:12.5px;font-weight:500;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal-ov .acts{display:flex;gap:6px}
.gal-ov .acts button{width:30px;height:30px;border-radius:var(--r-xs);background:rgba(255,255,255,.92);
  color:var(--n-700);display:flex;align-items:center;justify-content:center;transition:all .12s}
.gal-ov .acts button:hover{background:#fff;transform:translateY(-1px)}
.gal-ov .acts button.del:hover{color:#c0392b}

/* OVERLAY / MODALS */
.overlay{position:fixed;inset:0;background:rgba(7,30,18,.55);backdrop-filter:blur(3px);z-index:5000;
  display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s}
.overlay.show{opacity:1;visibility:visible}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:440px;max-width:90vw;
  padding:40px 38px;text-align:center;transform:translateY(10px);transition:transform .25s}
.overlay.show .modal{transform:translateY(0)}
.modal-sm{width:380px;text-align:left}
.pub-spinner{width:54px;height:54px;margin:0 auto 22px;border:4px solid var(--cb-100);border-top-color:var(--cb-500);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pub-check{width:62px;height:62px;margin:0 auto 22px;border-radius:50%;background:var(--cb-100);color:var(--cb-600);
  display:flex;align-items:center;justify-content:center;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h3{font-size:21px;font-weight:500;color:var(--n-900);margin-bottom:8px}
.modal p{font-size:14.5px;color:var(--n-500);line-height:1.6;margin-bottom:8px}
.modal .small{font-size:12.5px;color:var(--n-300);margin-bottom:24px}
.pub-steps{text-align:left;background:var(--n-10);border-radius:var(--r-sm);padding:16px 18px;margin-bottom:24px}
.pub-step{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--n-400);padding:5px 0}
.pub-step.done{color:var(--n-700)}
.pub-step .pc{width:20px;height:20px;border-radius:50%;border:2px solid var(--n-200);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.pub-step.done .pc{background:var(--cb-500);border-color:var(--cb-500);color:#fff}
.pub-step.err .pc{background:#e74c3c;border-color:#e74c3c;color:#fff}

/* TOAST */
.hint-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--n-900);
  color:#fff;padding:13px 22px;border-radius:var(--r-pill);font-size:13.5px;box-shadow:var(--sh-lg);z-index:6000;
  display:flex;align-items:center;gap:10px;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:90vw}
.hint-toast.show{transform:translateX(-50%) translateY(0)}
.hint-toast svg{color:var(--gold-400);flex-shrink:0}

/* CAPTION EDIT */
.cap-modal{padding:30px 28px;text-align:left}
.cap-modal h3{margin-bottom:20px}

/* ERROR */
.err-banner{background:#fff0f0;border:1px solid #f5c6c6;color:#c0392b;border-radius:var(--r-sm);padding:12px 16px;font-size:14px;margin-bottom:20px;display:none}
.err-banner.show{display:block}

/* SCROLLBARS */
.main::-webkit-scrollbar,.editor-form::-webkit-scrollbar{width:8px}
.main::-webkit-scrollbar-thumb,.editor-form::-webkit-scrollbar-thumb{background:var(--n-200);border-radius:4px;border:2px solid var(--n-10)}

@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar,.main{grid-column:1}
  .editor-wrap{grid-template-columns:1fr}
  .editor-preview{display:none}
  .dash-grid{grid-template-columns:1fr}
  .gal-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <img class="login-logo" src="https://coopbienestar.net/wp-content/uploads/2023/05/cropped-Logo-143x143.jpg" alt="CoopBienestar" />
    <h1>Panel de Publicación</h1>
    <p class="sub">Acceso para el equipo de CoopBienestar.<br/>Publica noticias y fotos sin tocar código.</p>
    <button class="gh-btn" id="login-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5Z"/></svg>
      Entrar con GitHub
    </button>
    <p class="login-foot">Solo los editores autorizados pueden acceder.<br/>Tu navegador recordará la sesión.</p>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-brand">
      <img src="https://coopbienestar.net/wp-content/uploads/2023/05/cropped-Logo-143x143.jpg" alt="" />

<script>
/* ─── CONFIG ─── */
const REPO       = 'dvsgnr/coopbienestar';
const BRANCH     = 'main';
const AUTH_URL   = 'https://coopbienestar-auth.pucheupierre.workers.dev/auth';
const API        = 'https://api.github.com';
const CATS       = ['Institución','Servicios','Comunidad','Educación','Crecimiento'];
const MESES      = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ─── STATE ─── */
let token         = sessionStorage.getItem('cb_token');
let ghUser        = null;
let noticias      = [];
let noticiasSHA   = null;
let fotos         = [];
let fotosSHA      = null;
let editIdx       = null;
let pendingImg    = null;
let galPendingImg = null;

/* ─── UTILS ─── */
function formatDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${parseInt(d)} de ${MESES[parseInt(m)-1]}, ${y}`;
}
function todayISO() {
  return new Date().toISOString().slice(0,10);
}
function toB64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function fromB64(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\s/g,''))));
}
function slugify(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function fileExt(name) {
  return name.split('.').pop().toLowerCase();
}
function uniqueName(original) {
  return Date.now() + '-' + original.replace(/[^a-z0-9.]/gi,'-').toLowerCase();
}

/* ─── GITHUB API ─── */
function ghHeaders() {
  return { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
}

async function ghGetFile(path) {
  const r = await fetch(`${API}/repos/${REPO}/contents/${path}?ref=${BRANCH}`, { headers: ghHeaders() });
  if (!r.ok) throw new Error(`Error leyendo ${path}: ${r.status}`);
  const d = await r.json();
  return { data: JSON.parse(fromB64(d.content)), sha: d.sha };
}

async function ghPutJSON(path, data, sha, msg) {
  const body = { message: msg, content: toB64(JSON.stringify(data, null, 2)), branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${REPO}/contents/${path}`, {
    method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || `Error guardando ${path}`); }
  const res = await r.json();
  return res.content.sha;
}

async function ghUploadImage(filename, base64data) {
  const content = base64data.replace(/^data:[^;]+;base64,/,'');
  const path = `img/uploads/${filename}`;
  let sha = null;
  try {
    const r = await fetch(`${API}/repos/${REPO}/contents/${path}`, { headers: ghHeaders() });
    if (r.ok) { const d = await r.json(); sha = d.sha; }
  } catch(e) {}
  const body = { message: `Imagen: ${filename}`, content, branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${REPO}/contents/${path}`, {
    method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Error subiendo imagen');
  return `img/uploads/${filename}`;
}

async function loadData() {
  const [n, g] = await Promise.all([
    ghGetFile('content/noticias.json'),
    ghGetFile('content/galeria.json')
  ]);
  noticias    = n.data.noticias || [];
  noticiasSHA = n.sha;
  fotos       = g.data.fotos || [];
  fotosSHA    = g.sha;
  document.getElementById('badge-news').textContent    = noticias.length;
  document.getElementById('badge-gallery').textContent = fotos.length;
}

/* ─── AUTH ─── */
const GH_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5Z"/></svg>`;

function resetLoginBtn() {
  const btn = document.getElementById('login-btn');
  if (!btn) return;
  btn.disabled = false;
  btn.innerHTML = GH_ICON + ' Entrar con GitHub';
}

function login() {
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Abriendo GitHub...';
  const popup = window.open(AUTH_URL, 'ghauth', 'width=620,height=720,left=200,top=80');

  const handler = async (e) => {
    if (typeof e.data !== 'string') return;

    /* Step 1 — Worker popup signals it's ready; we must respond to trigger token send */
    if (e.data === 'authorizing:github') {
      try { (e.source || popup).postMessage('authorizing:github', e.origin || '*'); } catch(_) {}
      return;
    }

    if (!e.data.startsWith('authorization:github:success:')) return;

    /* Step 2 — popup sends the token */
    window.removeEventListener('message', handler);
    try {
      const payload = JSON.parse(e.data.replace('authorization:github:success:',''));
      if (!payload.token) throw new Error('no token');
      token = payload.token;
      sessionStorage.setItem('cb_token', token);
      if (popup && !popup.closed) popup.close();
      await initApp();
    } catch(err) {
      resetLoginBtn();
      toast('Error al iniciar sesión. Intenta de nuevo.');
    }
  };
  window.addEventListener('message', handler);
}

async function initApp() {
  document.getElementById('login').classList.add('hidden');
  const app = document.getElementById('app');
  app.classList.add('show');

  try {
    const ur = await fetch(`${API}/user`, { headers: ghHeaders() });
    if (!ur.ok) throw new Error('bad_token');
    ghUser = await ur.json();
    const ava = document.getElementById('user-ava');
    if (ghUser.avatar_url) {
      ava.innerHTML = `<img src="${ghUser.avatar_url}" alt="" />`;
    } else {
      ava.textContent = (ghUser.login || '?')[0].toUpperCase();
    }
    document.getElementById('user-name').textContent = ghUser.name || ghUser.login || 'Editor';
    await loadData();
    nav('dash');
  } catch(e) {
    token = null;
    sessionStorage.removeItem('cb_token');
    app.classList.remove('show');
    document.getElementById('login').classList.remove('hidden');
    resetLoginBtn();
    if (e.message !== 'bad_token') toast('Error cargando datos. Verifica tu conexión.');
  }
}

/* ─── NAV ─── */
function setCrumb(html) { document.getElementById('crumb').innerHTML = html; }
function setActive(key) {
  document.querySelectorAll('.side-link').forEach(b => b.classList.toggle('active', b.dataset.nav === key));
}
function nav(view, arg) {
  const m = document.getElementById('main');
  m.scrollTop = 0;
  editIdx = null;
  pendingImg = null;
  if (view === 'dash') {
    setActive('dash'); setCrumb('<b>Inicio</b>'); m.innerHTML = viewDash();
    document.getElementById('go-news').onclick    = () => nav('news');
    document.getElementById('go-gallery').onclick = () => nav('gallery');
  } else if (view === 'news') {
    setActive('news'); setCrumb('<b>Noticias</b>'); m.innerHTML = viewNews();
    bindNewsList();
  } else if (view === 'gallery') {
    setActive('gallery'); setCrumb('<b>Galería</b>'); m.innerHTML = viewGallery();
    bindGallery();
  } else if (view === 'editNews') {
    editIdx = (arg !== undefined) ? arg : null;
    setActive('news');
    setCrumb(`Noticias › <b>${editIdx !== null ? 'Editar' : 'Nueva noticia'}</b>`);
    m.innerHTML = viewEditNews(editIdx);
    bindEditor();
  }
  document.getElementById('nav-dash').onclick    = () => nav('dash');
  document.getElementById('nav-news').onclick    = () => nav('news');
  document.getElementById('nav-gallery').onclick = () => nav('gallery');
}

/* ─── VIEWS ─── */
function viewDash() {
  const sorted = noticias.slice().sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  const recent = sorted.slice(0,3).map(n =>
    `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--n-50)">
      <img src="${n.imagen}" style="width:40px;height:32px;border-radius:4px;object-fit:cover;flex-shrink:0" />

        <div style="font-size:12px;color:var(--n-400)">${formatDate(n.fecha)}</div>

  </div>
  <div class="dash-grid">
    <button class="dash-card" id="go-news">
      <div class="dash-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></div>
      <h3>Noticias</h3>
      <p>Publica anuncios, eventos y comunicados para tus asociados.</p>
      <div class="count"><b>${noticias.length}</b> noticias publicadas</div>
      <span class="dash-arrow">Administrar noticias →</span>
    </button>
    <button class="dash-card" id="go-gallery">
      <div class="dash-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>
      <h3>Galería</h3>
      <p>Sube fotos de eventos y actividades de la cooperativa.</p>
      <div class="count"><b>${fotos.length}</b> fotos en la galería</div>
      <span class="dash-arrow">Administrar galería →</span>
    </button>
  </div>
  ${recent ? `<div style="margin-top:32px;max-width:520px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--n-400);margin-bottom:12px">Noticias recientes</div>
    ${recent}</div>` : ''}`;
}

function viewNews() {
  const sorted = noticias.slice().sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  const rows = sorted.map((n, si) => {
    const ri = noticias.indexOf(n);
    return `<div class="entry" data-real-idx="${ri}">
      <img class="entry-thumb" src="${n.imagen}" alt="" onerror="this.src=''" />
      <div class="entry-main entry-click">
        <h4>${n.titulo}</h4>
        <div class="entry-meta"><span class="entry-tag">${n.categoria}</span> · <span>${formatDate(n.fecha)}</span></div>
      </div>
      <div class="entry-actions">
        <button class="entry-btn edit-btn" title="Editar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> Editar
        </button>
        <button class="entry-btn del del-btn" title="Eliminar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="page-head">
    <div><h2>Noticias</h2><p>Anuncios y comunicados publicados en el sitio.</p></div>
    <button class="btn btn-primary btn-lg" id="new-news-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      Nueva noticia
    </button>
  </div>
  ${noticias.length === 0 ? '<p style="color:var(--n-400);padding:32px 0">No hay noticias aún. Crea la primera.</p>' :
    `<div class="entry-list">${rows}</div>`}`;
}

function viewEditNews(idx) {
  const n = idx !== null ? noticias[idx] : { titulo:'', fecha: todayISO(), categoria:'Institución', imagen:'', resumen:'', cuerpo:'' };
  const opts = CATS.map(c => `<option${c===n.categoria?' selected':''}>${c}</option>`).join('');

  return `
  <div class="page-head">
    <div><h2>${idx !== null ? 'Editar noticia' : 'Nueva noticia'}</h2><p>Llena el formulario; la vista previa se actualiza sola.</p></div>
    <button class="btn btn-ghost" id="back-btn">← Volver</button>
  </div>
  <div id="form-err" class="err-banner"></div>
  <div class="editor-wrap">
    <div class="editor-form">
      <div class="fg">
        <label>Título <span class="req">*</span></label>
        <input class="fld" id="f_title" placeholder="Ej: Asamblea General 2026" value="${n.titulo.replace(/"/g,'&quot;')}" />
      </div>
      <div class="fld-row">
        <div class="fg">
          <label>Fecha <span class="req">*</span></label>
          <input class="fld" id="f_date" type="date" value="${n.fecha}" />
        </div>
        <div class="fg">
          <label>Categoría</label>
          <select class="fld" id="f_cat">${opts}</select>
        </div>
      </div>
      <div class="fg">
        <label>Foto principal</label>
        <div class="drop ${hasImg?'has':''}" id="drop">
          ${hasImg
            ? `<img src="${n.imagen}" id="drop-img" alt=""/><div class="drop-replace"><span><b id="drop-name">${n.imagen.split('/').pop()}</b></span><span class="lnk">Cambiar foto</span></div><input type="file" id="img-input" accept="image/*" />`
            : `<div class="di"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div><div class="dt">Arrastra una foto aquí o haz clic</div><div class="ds">JPG o PNG</div><input type="file" id="img-input" accept="image/*" />`}
        </div>
      </div>
      <div class="fg">
        <label>Resumen <span class="req">*</span></label>
        <textarea class="fld" id="f_sum" placeholder="Una o dos frases para la tarjeta...">${n.resumen}</textarea>
        <div class="hint">Aparece en la lista de noticias.</div>
      </div>
      <div class="fg">
        <label>Cuerpo de la noticia</label>
        <textarea class="fld" id="f_body" style="min-height:120px" placeholder="Texto completo (opcional)...">${n.cuerpo||''}</textarea>

        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>
          Publicar
        </button>
      </div>
    </div>
    <div class="editor-preview">
      <div class="pv-label"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg> Vista previa</div>
      <div class="pv-card">
        <div class="pv-card-img" id="pv_img">${hasImg ? `<img src="${n.imagen}" style="width:100%;height:100%;object-fit:cover" />` : `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`}</div>
        <div class="pv-card-body">
          <span class="pv-tag" id="pv_cat">${n.categoria}</span>
          <span class="pv-date" id="pv_date">${formatDate(n.fecha)||'Fecha'}</span>
          <h3 id="pv_title">${n.titulo||'Título de la noticia'}</h3>
          <p id="pv_sum">${n.resumen||'El resumen aparecerá aquí...'}</p>
        </div>
      </div>
      <p class="pv-note">Así se verá la tarjeta en Noticias.</p>
    </div>
  </div>`;
}

function viewGallery() {
  const items = fotos.map((f,i) => `

          </button>

    </div>`).join('');
  return `
  <div class="page-head">

/* ─── BIND EVENTS ─── */
function bindNewsList() {
  const m = document.getElementById('main');
  const nb = document.getElementById('new-news-btn');
  if (nb) nb.onclick = () => nav('editNews');
  m.querySelectorAll('.entry').forEach(e => {
    const idx = parseInt(e.dataset.realIdx, 10);
    const ec = e.querySelector('.entry-click');
    const eb = e.querySelector('.edit-btn');
    const db = e.querySelector('.del-btn');
    if (ec) ec.onclick = () => nav('editNews', idx);
    if (eb) eb.onclick = () => nav('editNews', idx);
    if (db) db.onclick = () => confirmDelete(idx);
  });
}

function bindEditor() {
  const m  = document.getElementById('main');
  const bb = document.getElementById('back-btn');
  const cb = document.getElementById('cancel-btn');
  const pb = document.getElementById('publish-btn');
  if (bb) bb.onclick = () => nav('news');
  if (cb) cb.onclick = () => nav('news');
  if (pb) pb.onclick = () => publishNoticia();

  const t = document.getElementById('f_title');
  const d = document.getElementById('f_date');
  const c = document.getElementById('f_cat');
  const s = document.getElementById('f_sum');
  if (t) t.addEventListener('input', () => { document.getElementById('pv_title').textContent = t.value || 'Título de la noticia'; });
  if (s) s.addEventListener('input', () => { document.getElementById('pv_sum').textContent   = s.value || 'El resumen aparecerá aquí...'; });
  if (c) c.addEventListener('change', () => { document.getElementById('pv_cat').textContent  = c.value; });
  if (d) d.addEventListener('change', () => { document.getElementById('pv_date').textContent = d.value ? formatDate(d.value) : 'Fecha'; });

  const imgInput = document.getElementById('img-input');
  if (imgInput) {
    imgInput.addEventListener('change', function() {
      if (!this.files[0]) return;
      const file = this.files[0];
      const reader = new FileReader();
      reader.onload = function(ev) {
        pendingImg = { file, base64: ev.target.result, name: uniqueName(file.name) };
        const drop = document.getElementById('drop');
        drop.classList.add('has');
        drop.innerHTML = `<img src="${ev.target.result}" id="drop-img" alt=""/><div class="drop-replace"><span><b id="drop-name">${file.name}</b></span><span class="lnk">Cambiar foto</span></div><input type="file" id="img-input" accept="image/*" />`;
        document.getElementById('pv_img').innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover" />`;
        bindImgInput();
      };
      reader.readAsDataURL(file);
    });
  }
}

function bindImgInput() {
  const imgInput = document.getElementById('img-input');
  if (!imgInput) return;
  imgInput.addEventListener('change', function() {
    if (!this.files[0]) return;
    const file = this.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      pendingImg = { file, base64: ev.target.result, name: uniqueName(file.name) };
      document.getElementById('drop').innerHTML = `<img src="${ev.target.result}" id="drop-img" alt=""/><div class="drop-replace"><span><b>${file.name}</b></span><span class="lnk">Cambiar foto</span></div><input type="file" id="img-input" accept="image/*" />`;
      document.getElementById('pv_img').innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover" />`;
      bindImgInput();
    };
    reader.readAsDataURL(file);
  });
}

function bindGallery() {
  const fi = document.getElementById('gal-file-input');
  if (fi) {
    fi.addEventListener('change', function() {
      if (!this.files[0]) return;
      const file = this.files[0];
      const reader = new FileReader();
      reader.onload = (ev) => {
        galPendingImg = { file, base64: ev.target.result, name: uniqueName(file.name) };
        showAddPhotoModal();
      };
      reader.readAsDataURL(file);
      this.value = '';
    });
  }
  document.querySelectorAll('.gal-edit-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); editCaption(parseInt(b.dataset.idx, 10)); };
  });
  document.querySelectorAll('.gal-del-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); confirmDeletePhoto(parseInt(b.dataset.idx, 10)); };
  });
}

/* ─── PUBLISH NOTICIA ─── */
async function publishNoticia() {
  const title = document.getElementById('f_title').value.trim();
  const date  = document.getElementById('f_date').value;
  const cat   = document.getElementById('f_cat').value;
  const sum   = document.getElementById('f_sum').value.trim();
  const body  = (document.getElementById('f_body').value || '').trim();
  const err   = document.getElementById('form-err');

  if (!title || !date || !sum) {
    err.textContent = 'Completa los campos obligatorios: Título, Fecha y Resumen.';
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');

  let imagenPath = editIdx !== null ? noticias[editIdx].imagen : '';

  showPublishing('noticia', async (step) => {
    if (pendingImg) {
      step(1);
      imagenPath = await ghUploadImage(pendingImg.name, pendingImg.base64);
    }
    step(2);
    const item = { titulo: title, fecha: date, categoria: cat, imagen: imagenPath, resumen: sum, cuerpo: body };
    if (editIdx !== null) {
      noticias[editIdx] = item;
    } else {
      noticias.unshift(item);
    }
    noticiasSHA = await ghPutJSON('content/noticias.json', { noticias }, noticiasSHA,
      `${editIdx !== null ? 'Actualizar' : 'Nueva'} noticia: ${title}`);
    step(3);
    pendingImg = null;
    document.getElementById('badge-news').textContent = noticias.length;
  }, () => {
    closeOverlay();
    nav('news');
  });
}

/* ─── GALLERY ─── */
function showAddPhotoModal() {
  const ov = document.getElementById('overlay');
  const mc = document.getElementById('modal-content');
  mc.innerHTML = `
    <div class="cap-modal">
      <h3>Nueva foto</h3>
      <img src="${galPendingImg.base64}" style="width:100%;height:180px;object-fit:cover;border-radius:6px;margin-bottom:16px" />
      <div class="fg">
        <label>Descripción</label>
        <input class="fld" id="gal-cap-input" placeholder="Ej: Premiación de asociados 2025" />
        <div class="hint">Aparece al pasar el cursor sobre la foto.</div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn btn-ghost" id="cap-cancel">Cancelar</button>
        <button class="btn btn-green" style="flex:1;justify-content:center" id="cap-save">Subir y publicar</button>
      </div>
    </div>`;
  ov.classList.add('show');
  document.getElementById('cap-cancel').onclick = () => { ov.classList.remove('show'); galPendingImg = null; };
  document.getElementById('cap-save').onclick = () => publishFoto();
}

async function publishFoto() {
  const cap = (document.getElementById('gal-cap-input').value || '').trim();
  showPublishing('foto', async (step) => {
    step(1);
    const imgPath = await ghUploadImage(galPendingImg.name, galPendingImg.base64);
    step(2);
    fotos.push({ imagen: imgPath, titulo: cap || galPendingImg.file.name });
    fotosSHA = await ghPutJSON('content/galeria.json', { fotos }, fotosSHA, `Nueva foto: ${cap}`);
    step(3);
    galPendingImg = null;
    document.getElementById('badge-gallery').textContent = fotos.length;
  }, () => { closeOverlay(); nav('gallery'); });
}

function editCaption(idx) {
  const ov = document.getElementById('overlay');
  const mc = document.getElementById('modal-content');
  mc.innerHTML = `
    <div class="cap-modal">
      <h3>Editar descripción</h3>
      <img src="${fotos[idx].imagen}" style="width:100%;height:140px;object-fit:cover;border-radius:6px;margin-bottom:16px" />
      <div class="fg">
        <label>Descripción</label>
        <input class="fld" id="edit-cap-input" value="${fotos[idx].titulo}" />
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn btn-ghost" id="edit-cap-cancel">Cancelar</button>
        <button class="btn btn-green" style="flex:1;justify-content:center" id="edit-cap-save">Guardar</button>
      </div>
    </div>`;
  ov.classList.add('show');
  document.getElementById('edit-cap-cancel').onclick = () => ov.classList.remove('show');
  document.getElementById('edit-cap-save').onclick = async () => {
    const newCap = document.getElementById('edit-cap-input').value.trim();
    ov.classList.remove('show');
    fotos[idx].titulo = newCap;
    try {
      fotosSHA = await ghPutJSON('content/galeria.json', { fotos }, fotosSHA, `Editar descripción: ${newCap}`);
      toast('Descripción actualizada.');
      nav('gallery');
    } catch(e) { toast('Error guardando. Intenta de nuevo.'); }
  };
}

function confirmDeletePhoto(idx) {
  const ov = document.getElementById('overlay');
  const mc = document.getElementById('modal-content');
  mc.innerHTML = `
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:40px;margin-bottom:16px">🗑️</div>
      <h3>¿Eliminar esta foto?</h3>
      <p style="margin-bottom:24px">Se eliminará de la galería del sitio. La imagen en el repo no se borra.</p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-ghost" id="del-cancel">Cancelar</button>
        <button class="btn btn-danger" id="del-confirm">Sí, eliminar</button>
      </div>
    </div>`;
  ov.classList.add('show');
  document.getElementById('del-cancel').onclick  = () => ov.classList.remove('show');
  document.getElementById('del-confirm').onclick = async () => {
    ov.classList.remove('show');
    fotos.splice(idx, 1);
    try {
      fotosSHA = await ghPutJSON('content/galeria.json', { fotos }, fotosSHA, 'Eliminar foto de galería');
      document.getElementById('badge-gallery').textContent = fotos.length;
      toast('Foto eliminada.');
      nav('gallery');
    } catch(e) { toast('Error eliminando. Intenta de nuevo.'); fotos.splice(idx, 0, fotos[idx]); }
  };
}

function confirmDelete(idx) {
  const ov = document.getElementById('overlay');
  const mc = document.getElementById('modal-content');
  const n  = noticias[idx];
  mc.innerHTML = `
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:40px;margin-bottom:16px">🗑️</div>
      <h3>¿Eliminar esta noticia?</h3>
      <p style="margin-bottom:4px;font-weight:500">${n.titulo}</p>
      <p style="margin-bottom:24px">Esta acción no se puede deshacer desde el panel.</p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-ghost" id="del-cancel">Cancelar</button>
        <button class="btn btn-danger" id="del-confirm">Sí, eliminar</button>
      </div>
    </div>`;
  ov.classList.add('show');
  document.getElementById('del-cancel').onclick  = () => ov.classList.remove('show');
  document.getElementById('del-confirm').onclick = async () => {
    ov.classList.remove('show');
    noticias.splice(idx, 1);
    try {
      noticiasSHA = await ghPutJSON('content/noticias.json', { noticias }, noticiasSHA, `Eliminar noticia: ${n.titulo}`);
      document.getElementById('badge-news').textContent = noticias.length;
      toast('Noticia eliminada.');
      nav('news');
    } catch(e) { toast('Error eliminando. Intenta de nuevo.'); noticias.splice(idx, 0, n); }
  };
}

/* ─── PUBLISH OVERLAY ─── */
function showPublishing(kind, work, onDone) {
  const ov = document.getElementById('overlay');
  const mc = document.getElementById('modal-content');
  const label = kind === 'noticia' ? 'la noticia' : 'la foto';
  mc.innerHTML = `
    <div class="pub-spinner"></div>
    <h3>Publicando ${label}…</h3>
    <p>Guardando y actualizando el sitio.</p>
    <div class="pub-steps">
      <div class="pub-step" id="ps1"><span class="pc"></span> ${kind === 'noticia' ? 'Subiendo imagen' : 'Subiendo foto'}</div>
      <div class="pub-step" id="ps2"><span class="pc"></span> Guardando en el sitio</div>
      <div class="pub-step" id="ps3"><span class="pc"></span> Actualizando coopbienestar.net</div>
    </div>
    <p class="small">El sitio se actualiza en ~1–2 minutos.</p>`;
  ov.classList.add('show');

  const done = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('done');
    el.querySelector('.pc').innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>';
  };
  const errStep = (id, msg) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('err');
    el.querySelector('.pc').innerHTML = '✕';
    el.querySelector('span:last-child') && (el.querySelector('span:last-child').textContent = ' — ' + msg);
  };

  work((step) => { done(`ps${step}`); })
    .then(() => {
      done('ps1'); done('ps2'); done('ps3');
      setTimeout(() => {
        mc.innerHTML = `
          <div class="pub-check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg></div>
          <h3>¡Publicado!</h3>
          <p>Tu ${kind === 'noticia' ? 'noticia' : 'foto'} ya está en el sitio.<br/>Visible en <b>coopbienestar.net</b> en ~1–2 min.</p>
          <button class="btn btn-green btn-lg" style="width:100%;justify-content:center;margin-top:8px" id="done-btn">Entendido</button>`;
        document.getElementById('done-btn').onclick = onDone;
      }, 600);
    })
    .catch((e) => {
      mc.innerHTML = `
        <div style="font-size:40px;margin-bottom:16px;text-align:center">⚠️</div>
        <h3>Error al publicar</h3>
        <p style="margin-bottom:20px">${e.message || 'Ocurrió un error. Verifica tu conexión e intenta de nuevo.'}</p>
        <button class="btn btn-ghost" style="width:100%;justify-content:center" id="err-close">Cerrar</button>`;
      document.getElementById('err-close').onclick = () => ov.classList.remove('show');
    });
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

/* ─── TOAST ─── */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ─── BOOT ─── */
document.getElementById('login-btn').addEventListener('click', login);
if (token) {
  initApp().catch(() => {
    token = null;
    sessionStorage.removeItem('cb_token');
    document.getElementById('login').classList.remove('hidden');
  });
}
</script>
